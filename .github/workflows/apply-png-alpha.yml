          text = text[:start] + replacement + text[end:]
          text = text.replace('decode_png(&decode_base64(FTP0N3P08))', 'decode_png(&decode_base64(BASN3P08_TRNS))')
          p.write_text(text)
      - name: Format and test
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup default 1.98.0
          cargo fmt --all
          cargo test --workspace --all-targets
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/rm-codec/src/png.rs crates/rm-codec/tests/pngsuite_smoke.rs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(png): decode indexed color and tRNS transparency"
          git push origin "HEAD:${{ github.head_ref }}"
