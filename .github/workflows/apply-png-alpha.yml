name: apply-png-palette

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'build/phase2-png-color-alpha'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Apply indexed PNG support
        shell: python
        run: |
          from pathlib import Path
          lines = Path('.github/workflows/apply-png-palette.yml').read_text().splitlines()
          start = lines.index('      - name: Apply indexed PNG support')
          run_line = next(i for i in range(start + 1, len(lines)) if lines[i] == '        run: |')
          end = next(i for i in range(run_line + 1, len(lines)) if lines[i] == '      - name: Format and test')
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines[run_line + 1:end])
          exec(compile(code, 'apply-png-palette.yml', 'exec'))

          p = Path('crates/rm-codec/tests/pngsuite_smoke.rs')
          text = p.read_text()
          start = text.index('const FTP0N3P08: &str = ')
          end = text.index('const BASN3P08: &str = ', start)
          replacement = '''const BASN3P08_TRNS: &str = "iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAMAAABEpIrGAAAABGdBTUEAAYag\\nMeiWXwAAAwBQTFRF/wMH/wQH/wkH2Q4H/w4HAhYT/xoH/x8HCiUOsyUG/ioH\\n/y0HGS4JADD+ADD/ADH/ADP+ADT//zUHADb8/jkH+zkH9zsHADs9AD7/jj8F\\nAD/6/z8H/UQHAEn/AEn2/0sHUlUJ/1UHAFn/AFvt/14H8WQHAGX//WkHAGvf\\n/2oHAW5f/3MHAHX//3wHdn4KAIL6AIT/AIbP/4YHAIj524wGAIz8AIz/AY6I\\n/48H85YHxpgHpZkHAJ3//54HRp8EAKD7y6MGAKPvAaSy/6YHAamlAar/6KwG\\n/68HubCDAbPhvLN2x7QGAbb/Abj5/7gHz7pHwbsG/b8H2sEwAcGdAcT0AcT+\\nMMcDpMcF3MoG/csHAczM+9EH59AYAdL+AtOSAdScAdX87dsPAdrwpdwFAd36\\n+d0Gkt4EAeC4AuCb9OEK+eMHAuWFwOQGJeYD9uYHj+gE9OkIAuyLAezjAe7u\\nZfEEAfHaAfDop/AFG/MCfvMEAvZxhfgFFvoBAvnblPoFAvrHt/wFsPwFAvzT\\nAvy+pPsFDP6AwP0FpP0FGv5VDv4Bhf0FBP20xP0FAv3GA/9bA/9Quv8FCf8C\\nA/92Cf8DCv8BA/9MA/9WA/9SDf8BA/8xA/9lPf8ggf8Fsf8FA/8llf8FB/8G\\nwP8FAv+DA/9iVf8LAv+jAv+VBP8XBv8MA/9DoP8Fd/8GZv8I/////v7+/v7+\\n/Pz8/Pz8+vr6+vr6+Pj4+Pj49/f39fX19fX18/Pz8/Pz8fHx8fHx7+/v7u7u\\n7u7u7Ozs7Ozs6urq6urq6Ojo5+fn5+fn5eXl5eXl4+Pj4uLi4uLi4ODg4ODg\\n3t7e3t7e3Nzc29vb29vb2dnZ2dnZ19fX1tbW1tbW1NTU1NTU0tLS0dHR0dHR\\nz8/Pzc3Nzc3NzMzMzMzMysrKycnJycnJx8fHx8fHxcXFxMTExMTEwsLCwcHB\\nwcHBv7+/v7+/vb29vLy8vLy8urq6ubm5ubm5t7e3tra2tra2tLS0srKysrKy\\nsbGxsbGxr6+vrq6urq6u/+L2KQAAAK10Uk5Txbu+wroEur0Ew1S/BcGvo82W\\nv9VYS0MIk7/cy1+X38cIz5zjx0GjYuLMDMqnyQtBsuTNSjtXshPJYxIOuMy4\\nYBY948cWwWHF/jv9HMBmx/c6xvQebcq8IGDEPMvvyuYpz+13NdXRJTct5tbp\\nXLnfMuY5fNkrhd1fxi/pY8Lda4qYkOKMhdysfdrEduGh3+vuyJuTkqzs7Je3\\nlurY2dOX24S5kZPZipCJjpfZ2dXh8TtsAAAB9ElEQVQ4y03R72tScRTH8duD\\nWyBU1NhltBT7HVKt2p0yW6RoiThDcWIp0vSqxVqrqbf1A/NaOkktXCZBVM5y\\nRaM/snPO9/u9+nr6eT86R5LtdkVRLNwBQTLJbrcyUVgsB8khbhYDKpTp6ZPM\\ncTQrUOA+hy4IZ5lThAKPqqo8WASXmesEAw8GqrooBAIBn893k4HAEwqFIpHI\\nHeE+ikajd1OpTCYzDu5xnU4Hi1R+beMZgCDEgnVzxySfXxPBDdg1TYusk2bN\\ngH17OBx2N8wgkYBAw3mr2axhAUG3+x3sY5AoFApPNW0LvGk26/WaYWzDvg8G\\ngwELXoLXqAXqdcP4ZoKgUGZE0Gr9M41GknylXB4XsD5hRtxEsEt6vR7uLwRJ\\ntk+sFOzsfAbvOUl2OByb6I/wg+sTCGKxR5vM3wn9vghc4+AX9wV8BR+BJPsh\\nEMXeT/QJNBqNV4SCB7zYI79Rm3sMgR+Ch6RYLFar78gHpt1mAYzJZD