name: apply-png-palette

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'build/phase2-png-color-alpha'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Apply indexed PNG support
        shell: python
        run: |
          from pathlib import Path
          lines = Path('.github/workflows/apply-png-palette.yml').read_text().splitlines()
          start = lines.index('      - name: Apply indexed PNG support')
          run_line = next(i for i in range(start + 1, len(lines)) if lines[i] == '        run: |')
          end = next(i for i in range(run_line + 1, len(lines)) if lines[i] == '      - name: Format and test')
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines[run_line + 1:end])
          exec(compile(code, 'apply-png-palette.yml', 'exec'))
      - name: Format and test
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup default 1.98.0
          cargo fmt --all
          cargo test --workspace --all-targets
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/rm-codec/src/png.rs crates/rm-codec/tests/pngsuite_smoke.rs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(png): decode indexed color and tRNS transparency"
          git push origin "HEAD:${{ github.head_ref }}"
