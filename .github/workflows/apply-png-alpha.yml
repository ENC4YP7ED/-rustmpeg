name: apply-png-alpha

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'build/phase2-png-color-alpha'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Apply alpha support
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected block not found in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          replace(
              'crates/rm-codec/src/png.rs',
              '''    let color_type = match frame.format {\n        PixelFormat::Gray8 => 0_u8,\n        PixelFormat::Rgb24 => 2_u8,\n    };''',
              '''    let color_type = match frame.format {\n        PixelFormat::Gray8 => 0_u8,\n        PixelFormat::Rgb24 => 2_u8,\n        PixelFormat::GrayAlpha8 => 4_u8,\n        PixelFormat::Rgba32 => 6_u8,\n    };'''
          )
          replace(
              'crates/rm-codec/src/png.rs',
              '''    if !matches!(header.color_type, 0 | 2) {''',
              '''    if !matches!(header.color_type, 0 | 2 | 4 | 6) {'''
          )
          replace(
              'crates/rm-codec/src/png.rs',
              '''    let (format, bytes_per_pixel) = match header.color_type {\n        0 => (PixelFormat::Gray8, 1_usize),\n        2 => (PixelFormat::Rgb24, 3_usize),\n        _ => return Err(MediaError::unsupported("unsupported PNG color type")),\n    };''',
              '''    let (format, bytes_per_pixel) = match header.color_type {\n        0 => (PixelFormat::Gray8, 1_usize),\n        2 => (PixelFormat::Rgb24, 3_usize),\n        4 => (PixelFormat::GrayAlpha8, 2_usize),\n        6 => (PixelFormat::Rgba32, 4_usize),\n        _ => return Err(MediaError::unsupported("unsupported PNG color type")),\n    };'''
          )
          replace(
              'crates/rm-codec/src/png.rs',
              '/// Decodes a non-interlaced 8-bit grayscale or RGB PNG image.',
              '/// Decodes non-interlaced 8-bit grayscale, RGB, gray+alpha, or RGBA PNG images.'
          )
          replace(
              'crates/rm-codec/src/png.rs',
              '/// Encodes an 8-bit grayscale or RGB frame as a non-interlaced PNG.',
              '/// Encodes an 8-bit grayscale, RGB, gray+alpha, or RGBA frame as a non-interlaced PNG.'
          )

          replace(
              'crates/rm-codec/src/tga.rs',
              '''    let (format, bytes_per_pixel, rle) = match (image_type, depth) {\n        (TYPE_TRUECOLOR, 24 | 32) => (PixelFormat::Rgb24, usize::from(depth / 8), false),\n        (TYPE_GRAYSCALE, 8) => (PixelFormat::Gray8, 1, false),\n        (TYPE_RLE_TRUECOLOR, 24 | 32) => (PixelFormat::Rgb24, usize::from(depth / 8), true),''',
              '''    let (format, bytes_per_pixel, rle) = match (image_type, depth) {\n        (TYPE_TRUECOLOR, 24) => (PixelFormat::Rgb24, 3, false),\n        (TYPE_TRUECOLOR, 32) => (PixelFormat::Rgba32, 4, false),\n        (TYPE_GRAYSCALE, 8) => (PixelFormat::Gray8, 1, false),\n        (TYPE_RLE_TRUECOLOR, 24) => (PixelFormat::Rgb24, 3, true),\n        (TYPE_RLE_TRUECOLOR, 32) => (PixelFormat::Rgba32, 4, true),'''
          )
          replace(
              'crates/rm-codec/src/tga.rs',
              '''        if format == PixelFormat::Gray8 {\n            output[destination_index] = source[source_index];\n        } else {\n            output[destination_index] = source[source_index + 2];\n            output[destination_index + 1] = source[source_index + 1];\n            output[destination_index + 2] = source[source_index];\n        }''',
              '''        match format {\n            PixelFormat::Gray8 => output[destination_index] = source[source_index],\n            PixelFormat::Rgb24 => {\n                output[destination_index] = source[source_index + 2];\n                output[destination_index + 1] = source[source_index + 1];\n                output[destination_index + 2] = source[source_index];\n            }\n            PixelFormat::Rgba32 => {\n                output[destination_index] = source[source_index + 2];\n                output[destination_index + 1] = source[source_index + 1];\n                output[destination_index + 2] = source[source_index];\n                output[destination_index + 3] = source[source_index + 3];\n            }\n            PixelFormat::GrayAlpha8 => unreachable!("TGA decoder does not produce gray+alpha"),\n        }'''
          )
          replace(
              'crates/rm-codec/src/tga.rs',
              '''        PixelFormat::Rgb24 => (\n            if rle {\n                TYPE_RLE_TRUECOLOR\n            } else {\n                TYPE_TRUECOLOR\n            },\n            24_u8,\n            3_usize,\n        ),\n    };''',
              '''        PixelFormat::Rgb24 => (\n            if rle {\n                TYPE_RLE_TRUECOLOR\n            } else {\n                TYPE_TRUECOLOR\n            },\n            24_u8,\n            3_usize,\n        ),\n        PixelFormat::Rgba32 => (\n            if rle {\n                TYPE_RLE_TRUECOLOR\n            } else {\n                TYPE_TRUECOLOR\n            },\n            32_u8,\n            4_usize,\n        ),\n        PixelFormat::GrayAlpha8 => {\n            return Err(MediaError::unsupported(\n                "TGA gray+alpha encoding is not representable by the implemented TGA surface",\n            ));\n        }\n    };'''
          )
          replace(
              'crates/rm-codec/src/tga.rs',
              '''        PixelFormat::Rgb24 => {\n            for pixel in frame.data.as_slice().chunks_exact(3) {\n                raw.extend_from_slice(&[pixel[2], pixel[1], pixel[0]]);\n            }\n        }\n    }''',
              '''        PixelFormat::Rgb24 => {\n            for pixel in frame.data.as_slice().chunks_exact(3) {\n                raw.extend_from_slice(&[pixel[2], pixel[1], pixel[0]]);\n            }\n        }\n        PixelFormat::Rgba32 => {\n            for pixel in frame.data.as_slice().chunks_exact(4) {\n                raw.extend_from_slice(&[pixel[2], pixel[1], pixel[0], pixel[3]]);\n            }\n        }\n        PixelFormat::GrayAlpha8 => unreachable!("rejected before raster conversion"),\n    }'''
          )
          replace(
              'crates/rm-codec/src/tga.rs',
              '''    output.push(depth);\n    output.push(0x20);''',
              '''    output.push(depth);\n    output.push(if frame.format == PixelFormat::Rgba32 { 0x28 } else { 0x20 });'''
          )

          p = Path('crates/rm-codec/tests/pngsuite_smoke.rs')
          text = p.read_text()
          old = '''#[test]\nfn pngsuite_vectors_expose_current_color_model_gaps() {\n    for (name, vector) in [\n        ("basn4a08 gray+alpha", BASN4A08),\n        ("basn6a08 rgba", BASN6A08),\n        ("basn3p08 palette", BASN3P08),\n    ] {\n        assert!(decode_png(&decode_base64(vector)).is_err(), "{name} unexpectedly decoded before support was implemented");\n    }\n}'''
          new = '''#[test]\nfn pngsuite_8_bit_alpha_paths_decode() {\n    let gray_alpha = decode_png(&decode_base64(BASN4A08)).unwrap();\n    assert_eq!((gray_alpha.width, gray_alpha.height, gray_alpha.format), (32, 32, PixelFormat::GrayAlpha8));\n\n    let rgba = decode_png(&decode_base64(BASN6A08)).unwrap();\n    assert_eq!((rgba.width, rgba.height, rgba.format), (32, 32, PixelFormat::Rgba32));\n}\n\n#[test]\nfn pngsuite_palette_remains_an_explicit_gap() {\n    assert!(decode_png(&decode_base64(BASN3P08)).is_err());\n}'''
          if old not in text:
              raise SystemExit('expected PngSuite gap test not found')
          p.write_text(text.replace(old, new, 1))
      - name: Format and test
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup default 1.98.0
          cargo fmt --all
          cargo test --workspace --all-targets
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/rm-codec/src/png.rs crates/rm-codec/src/tga.rs crates/rm-codec/tests/pngsuite_smoke.rs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(png): add 8-bit alpha color models"
          git push origin "HEAD:${{ github.head_ref }}"
