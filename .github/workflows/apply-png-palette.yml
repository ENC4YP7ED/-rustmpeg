name: apply-png-palette

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'build/phase2-png-color-alpha'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Apply indexed PNG support
        shell: python
        run: |
          from pathlib import Path

          p = Path('crates/rm-codec/src/png.rs')
          text = p.read_text()

          def rep(old, new):
              global text
              if old not in text:
                  raise SystemExit(f'expected PNG block not found: {old[:100]!r}')
              text = text.replace(old, new, 1)

          rep(
              '''    let mut saw_iend = false;\n    let mut saw_plte = false;''',
              '''    let mut saw_iend = false;\n    let mut saw_plte = false;\n    let mut palette: Option<Vec<u8>> = None;\n    let mut transparency: Option<Vec<u8>> = None;'''
          )

          rep(
              '''                if header.color_type == 0 {\n                    return Err(MediaError::invalid_data(\n                        "grayscale PNG must not contain a PLTE chunk",\n                    ));\n                }\n                if data.is_empty() || data.len() % 3 != 0 || data.len() > 768 {\n                    return Err(MediaError::invalid_data("invalid PNG PLTE length"));\n                }\n                saw_plte = true;''',
              '''                if matches!(header.color_type, 0 | 4) {\n                    return Err(MediaError::invalid_data(\n                        "grayscale PNG must not contain a PLTE chunk",\n                    ));\n                }\n                if data.is_empty() || data.len() % 3 != 0 || data.len() > 768 {\n                    return Err(MediaError::invalid_data("invalid PNG PLTE length"));\n                }\n                let entries = data.len() / 3;\n                if header.color_type == 3 && entries > (1_usize << header.bit_depth) {\n                    return Err(MediaError::invalid_data(\n                        "PNG PLTE has more entries than indexed bit depth permits",\n                    ));\n                }\n                palette = Some(data.to_vec());\n                saw_plte = true;'''
          )

          marker = '''            b"IDAT" => {'''
          trns = '''            b"tRNS" => {\n                let header = ihdr\n                    .ok_or_else(|| MediaError::invalid_data("PNG tRNS appeared before IHDR"))?;\n                if saw_idat {\n                    return Err(MediaError::invalid_data("PNG tRNS appeared after IDAT"));\n                }\n                if transparency.is_some() {\n                    return Err(MediaError::invalid_data("PNG contains multiple tRNS chunks"));\n                }\n                match header.color_type {\n                    0 if data.len() != 2 => {\n                        return Err(MediaError::invalid_data(\n                            "grayscale PNG tRNS length must be 2 bytes",\n                        ));\n                    }\n                    2 if data.len() != 6 => {\n                        return Err(MediaError::invalid_data(\n                            "truecolor PNG tRNS length must be 6 bytes",\n                        ));\n                    }\n                    3 => {\n                        let entries = palette\n                            .as_ref()\n                            .ok_or_else(|| MediaError::invalid_data("indexed PNG tRNS requires PLTE"))?\n                            .len()\n                            / 3;\n                        if data.len() > entries {\n                            return Err(MediaError::invalid_data(\n                                "indexed PNG tRNS has more alpha entries than PLTE",\n                            ));\n                        }\n                    }\n                    4 | 6 => {\n                        return Err(MediaError::invalid_data(\n                            "PNG color types with alpha must not contain tRNS",\n                        ));\n                    }\n                    _ => {}\n                }\n                transparency = Some(data.to_vec());\n            }\n'''
          if marker not in text:
              raise SystemExit('IDAT marker not found')
          text = text.replace(marker, trns + marker, 1)

          rep(
              '''    let header = ihdr.ok_or_else(|| MediaError::invalid_data("PNG has no IHDR chunk"))?;\n    decode_scanlines(header, &idat)''',
              '''    let header = ihdr.ok_or_else(|| MediaError::invalid_data("PNG has no IHDR chunk"))?;\n    if header.color_type == 3 && palette.is_none() {\n        return Err(MediaError::invalid_data("indexed PNG requires a PLTE chunk"));\n    }\n    decode_scanlines(\n        header,\n        &idat,\n        palette.as_deref(),\n        transparency.as_deref(),\n    )'''
          )

          rep(
              '''    if !matches!(header.color_type, 0 | 2 | 4 | 6) {''',
              '''    if !matches!(header.color_type, 0 | 2 | 3 | 4 | 6) {'''
          )

          rep(
              '''fn decode_scanlines(header: Ihdr, compressed: &[u8]) -> Result<VideoFrame> {\n    let (format, bytes_per_pixel) = match header.color_type {''',
              '''fn decode_scanlines(\n    header: Ihdr,\n    compressed: &[u8],\n    palette: Option<&[u8]>,\n    transparency: Option<&[u8]>,\n) -> Result<VideoFrame> {\n    if header.color_type == 3 {\n        return decode_indexed_scanlines(header, compressed, palette, transparency);\n    }\n\n    let (format, bytes_per_pixel) = match header.color_type {'''
          )

          insert_before = '''fn unfilter_row('''
          helper = r'''fn decode_indexed_scanlines(
    header: Ihdr,
    compressed: &[u8],
    palette: Option<&[u8]>,
    transparency: Option<&[u8]>,
) -> Result<VideoFrame> {
    let palette = palette.ok_or_else(|| MediaError::invalid_data("indexed PNG requires PLTE"))?;
    let palette_entries = palette.len() / 3;
    let width = usize::try_from(header.width)
        .map_err(|_| MediaError::overflow("PNG width exceeds usize"))?;
    let height = usize::try_from(header.height)
        .map_err(|_| MediaError::overflow("PNG height exceeds usize"))?;
    let encoded_row = width
        .checked_add(1)
        .ok_or_else(|| MediaError::overflow("PNG indexed row size overflow"))?;
    let expected_size = encoded_row
        .checked_mul(height)
        .ok_or_else(|| MediaError::overflow("PNG indexed decompressed size overflow"))?;
    let filtered = zlib::decompress(compressed, expected_size)?;
    if filtered.len() != expected_size {
        return Err(MediaError::invalid_data(format!(
            "PNG decompressed data has {} bytes but {expected_size} are required",
            filtered.len()
        )));
    }

    let index_count = width
        .checked_mul(height)
        .ok_or_else(|| MediaError::overflow("PNG indexed pixel count overflow"))?;
    let mut indices = vec![0_u8; index_count];
    for row_index in 0..height {
        let encoded_start = row_index * encoded_row;
        let filter = filtered[encoded_start];
        let raw = &filtered[encoded_start + 1..encoded_start + encoded_row];
        let output_start = row_index * width;
        let (before, current_and_after) = indices.split_at_mut(output_start);
        let current = &mut current_and_after[..width];
        let previous = if row_index == 0 {
            None
        } else {
            Some(&before[before.len() - width..])
        };
        unfilter_row(filter, raw, current, previous, 1)?;
    }

    let has_alpha = transparency.is_some();
    let format = if has_alpha {
        PixelFormat::Rgba32
    } else {
        PixelFormat::Rgb24
    };
    let channels = format.bytes_per_pixel();
    let output_len = index_count
        .checked_mul(channels)
        .ok_or_else(|| MediaError::overflow("PNG indexed expansion size overflow"))?;
    let mut output = Vec::with_capacity(output_len);
    for index in indices {
        let entry = usize::from(index);
        if entry >= palette_entries {
            return Err(MediaError::invalid_data(format!(
                "PNG palette index {entry} exceeds PLTE entry count {palette_entries}"
            )));
        }
        let offset = entry * 3;
        output.extend_from_slice(&palette[offset..offset + 3]);
        if let Some(alpha) = transparency {
            output.push(alpha.get(entry).copied().unwrap_or(255));
        }
    }

    VideoFrame::from_vec(header.width, header.height, format, output)
}

'''
          if insert_before not in text:
              raise SystemExit('unfilter marker not found')
          text = text.replace(insert_before, helper + insert_before, 1)
          p.write_text(text)

          p = Path('crates/rm-codec/tests/pngsuite_smoke.rs')
          text = p.read_text()
          text = text.replace(
              'const BASN3P08: &str = ',
              'const FTP0N3P08: &str = "iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAMAAABEpIrGAAAABGdBTUEAAYag\\nMeiWXwAAAt9QTFRFFBRtgFZWtbW4qEJCn5+fsSAgixUVnZ2dGxtZm5ubAACE\\nmZmZj6ePl5eXlZWVk5OTKSlWkZGRAACbj4+Pi5WLLi6njY2NgAAAi4uLuQAA\\niYmJDAzVeHV1h4eHAACyhYWFpQAA3gAAgYGBf39/AACefX19AADJe3t7eXl5\\nNzdWd3d3dXV1c3NzSKlIjgAAAgJkAABiVolWKCh8U4tTiYmPZ2dnZWVlXW1d\\nE+UThiYmby0tRJFEYWFhO507RIlEPZM9AACkAPMAAPEAWVlZV1dXVVVVU1NT\\nNIU0UVFRJJckT09POjpBEBC6sg8PAMcAAMUA/Pz8AMMABASXAMEALXct+vr6\\nAL8AAABoAL0A2tTUEBB7Ca0J+Pj4ALkAALcAnJyh9vb2DKEMALMAALEAEJEQ\\nAKsA8vLyAKkAAKcA7u7u7OzsAJcA6urqAABrAI0AAIsAAIkAAIcAMTExGRkq\\nBwdAEhKuCQnu09bTzMzMkwAAoyoqxsbGxMTEzAAA0woKgWtreD4+AwNtAACf\\nCgpWRkZIQUFNc11dUQcHqKio7e3voKCgnp6enJycAAC5mpqasgAAmJiY6wAA\\nlpaWngAAlJSUExMckpKSkJCQjo6OAACRioqKiIiIdqJ2hYiFhoaGhISEeA8P\\ngoKCfoJ+fn5+fHx8enp6SsBKdnZ2dHR0cnJycHBwmAAAbm5uanBqemZmampq\\nhAAARKJES5ZLYWRhYmJiAPQAOJg4XFxcWlpaAOYAAgJdQnhCVlZWAADwLpQu\\nR2hHMTFgANgAUlJSUFBQAM4AIZgh////AMgATExM/f39AMYAAACdb2tr6g4O\\nSEhIALwANGY0AgL1U1NgALAAAK4AtwAAAKQA7+/vAKIAj09PlTQ0AJgAAJYA\\nAJIA5+fnAIwA4+PjAIAAkgYGAQFvZFZZAABkTk5rz8/P3d3gAAB7ycnJFhZB\\nISFZV1dZRER4v7+/693dLS1UCgpgAAD/v319RGIGqgAAApBJREFUOI1jUCYA\\nGEhU8OBVGh4F95gWmz2xZP7yAauCzPdSpm0NbHobxDesrvoSGYCqIK2Gb+WZ\\nBsvKyZXiC6za29s3PFrX9TwGpiDmVd9ynTbLR5MV+mtrJRXYLBeIr9Z7skZn\\nOWdNJlhBhfJybe1bkv1XfW/dZFVUnDhRsVZS/Iw2EKzvAyt4IT97vjqjL+tN\\nGS0trXrmurNn66oYgcxV2w+9ByvIma80d4aUsgYqWL7F9fCJexA3LPK8ZivC\\nLzxfHQaWLtVY73L4xDlnqC9mJZ1yXDaNj3eK7BIoWLndKChKoGUhVMG06Iit\\nFoJTeLk5uSWUFy9W1dpyyUdtZni4QAdUwZTEpJ1b5/CLbNTl6e6ZsXj9jrfS\\ne5t2lRhwlEMVdBxNPb512TTd8+n72Fm6lu5wFv2stqt4arNmAFQB074bV3Y6\\niWw8fntbTzfLCudnF/c2ep97LbASFtTV7sl5Rxw32frdtudk714DNMDhTWtU\\n08x4mILI3ckPY51SbE9l2/dxspu+LdvbeCBI5eWnapiCnN1XChMPZngG3rGf\\n0Ndj8+5zL8frl7m5HAkwBQH70++EBPvfDb67iZe7b4foRa6PxfqPhZ4honvt\\ntWv7Ew/mh+Vt4uOd5FK6N7y1iEEu1wShQOzG5Qt2x7PP37fm5xPe49Or33LA\\n4XRzNUJBKI/7ZrPoK7H5xoL8Uq6lpz8dCJLjYEJJcs/XmO1LiiswFBZUco3i\\n0ueayfAcLU1mzTO/nFRgLCa81PVj41MDoxcYiTag4+jlQkMJsRVu3sUl7zqx\\nJfvybSGLZkusOeRVpBWKPV9c75o/b7apx+Guk9jyBQgcey8/z+YQE7IQetZ7\\nMd2sQhmfAuWEB8r4FWAAANxEPMkO1rmYAAAAAElFTkSuQmCC\\n";\nconst BASN3P08: &str = ',
              1
          )
          old = '''#[test]\nfn pngsuite_palette_remains_an_explicit_gap() {\n    assert!(decode_png(&decode_base64(BASN3P08)).is_err());\n}'''
          new = '''#[test]\nfn pngsuite_8_bit_palette_decodes_to_rgb() {\n    let frame = decode_png(&decode_base64(BASN3P08)).unwrap();\n    assert_eq!((frame.width, frame.height, frame.format), (32, 32, PixelFormat::Rgb24));\n}\n\n#[test]\nfn pngsuite_indexed_transparency_decodes_to_rgba() {\n    let frame = decode_png(&decode_base64(FTP0N3P08)).unwrap();\n    assert_eq!((frame.width, frame.height, frame.format), (32, 32, PixelFormat::Rgba32));\n}'''
          if old not in text:
              raise SystemExit('palette gap test not found')
          p.write_text(text.replace(old, new, 1))
      - name: Format and test
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup default 1.98.0
          cargo fmt --all
          cargo test --workspace --all-targets
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/rm-codec/src/png.rs crates/rm-codec/tests/pngsuite_smoke.rs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(png): decode indexed color and tRNS transparency"
          git push origin "HEAD:${{ github.head_ref }}"
