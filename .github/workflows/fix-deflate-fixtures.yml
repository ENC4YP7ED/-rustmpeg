name: fix-deflate-fixtures

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Correct malformed dynamic-Huffman fixtures
        shell: python
        run: |
          from pathlib import Path

          raw = Path("crates/rm-compress/src/deflate.rs")
          text = raw.read_text()
          old = "0x55, 0x55, 0xF5, 0xD7, 0x07,"
          new = "0x55, 0xF5, 0xD7, 0x07,"
          if old in text:
              text = text.replace(old, new, 1)
              raw.write_text(text)

          zlib = Path("crates/rm-compress/src/zlib.rs")
          text = zlib.read_text()
          old = "0x55, 0x55, 0xF5, 0xD7, 0x07, 0x4E, 0xCB, 0x83, 0x03,"
          new = "0x55, 0xF5, 0xD7, 0x07, 0x4E, 0xCB, 0x83, 0x03,"
          if old in text:
              text = text.replace(old, new, 1)
              zlib.write_text(text)
      - name: Commit fixture corrections
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/rm-compress/src/deflate.rs crates/rm-compress/src/zlib.rs
          git commit -m "test(compress): fix dynamic Huffman reference vectors"
          git push origin "HEAD:${{ github.head_ref }}"
