name: fix-png-capability-test

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Update PNG capability expectation
        shell: python
        run: |
          from pathlib import Path
          path = Path("apps/ffprobe/tests/raster_e2e.rs")
          text = path.read_text()
          text = text.replace(
              'fn capability_list_includes_only_the_newly_implemented_rasters() {',
              'fn capability_list_includes_implemented_rasters() {'
          )
          text = text.replace(
              'for codec in ["pbm", "pgm", "ppm", "bmp", "targa"] {',
              'for codec in ["pbm", "pgm", "ppm", "bmp", "targa", "png"] {'
          )
          text = text.replace('    assert!(!stdout.contains("png"));\n', '')
          path.write_text(text)
      - name: Commit expectation update
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/ffprobe/tests/raster_e2e.rs
          git commit -m "test(png): advertise PNG capability"
          git push origin "HEAD:${{ github.head_ref }}"
