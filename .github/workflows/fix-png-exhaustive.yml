name: fix-png-exhaustive

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Apply PNG exhaustive match fixes
        shell: python
        run: |
          from pathlib import Path

          ffprobe = Path("crates/rm-cli/src/ffprobe.rs")
          text = ffprobe.read_text()
          text = text.replace(
              '"input format is not implemented yet (supported: wav, image2 PBM/PGM/PPM/BMP/TGA)",',
              '"input format is not implemented yet (supported: wav, image2 PBM/PGM/PPM/BMP/TGA/PNG)",'
          )
          text = text.replace(
              'CodecId::Pbm | CodecId::Pgm | CodecId::Ppm | CodecId::Bmp | CodecId::Targa => "unknown",',
              'CodecId::Pbm | CodecId::Pgm | CodecId::Ppm | CodecId::Bmp | CodecId::Targa | CodecId::Png => "unknown",'
          )
          ffprobe.write_text(text)

          wave = Path("crates/rm-format/tests/wave_matrix.rs")
          text = wave.read_text().replace(
              'CodecId::Pbm | CodecId::Pgm | CodecId::Ppm | CodecId::Bmp | CodecId::Targa => {',
              'CodecId::Pbm | CodecId::Pgm | CodecId::Ppm | CodecId::Bmp | CodecId::Targa | CodecId::Png => {'
          )
          wave.write_text(text)
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/rm-cli/src/ffprobe.rs crates/rm-format/tests/wave_matrix.rs
          git commit -m "fix(png): cover PNG in exhaustive codec matches"
          git push origin "HEAD:${{ github.head_ref }}"
