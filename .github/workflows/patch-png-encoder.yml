name: patch-png-encoder

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.number == 7
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Wire compressed PNG encoder
        shell: python
        run: |
          from pathlib import Path

          lib = Path('crates/rm-codec/src/lib.rs')
          text = lib.read_text()
          anchor = 'pub mod png;\n'
          if 'pub mod png_encode;' not in text:
              if anchor not in text:
                  raise SystemExit('rm-codec module anchor not found')
              text = text.replace(anchor, anchor + 'pub mod png_encode;\n', 1)
          lib.write_text(text)

          png = Path('crates/rm-codec/src/png.rs')
          text = png.read_text()
          old = 'pub use baseline::{encode_png, probe_png};'
          new = 'pub use baseline::probe_png;\npub use crate::png_encode::encode_png;'
          if old not in text:
              raise SystemExit('PNG re-export anchor not found')
          png.write_text(text.replace(old, new, 1))

          enc = Path('crates/rm-codec/src/png_encode.rs')
          text = enc.read_text()
          old = '''        let compressed = encode_png(&source).unwrap();\n        let stored = crate::png::baseline::encode_png(&source).unwrap();\n        assert!(compressed.len() < stored.len() / 8);'''
          new = '''        let compressed = encode_png(&source).unwrap();\n        assert!(compressed.len() < source.data.len() / 8);'''
          if old not in text:
              raise SystemExit('PNG compression test anchor not found')
          enc.write_text(text.replace(old, new, 1))
      - name: Format and test full workspace
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup default 1.98.0
          cargo fmt --all
          cargo test --workspace --all-targets
      - name: Commit tested encoder integration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/rm-codec/src/lib.rs crates/rm-codec/src/png.rs crates/rm-codec/src/png_encode.rs crates/rm-compress/src
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(png): enable adaptive compressed encoder"
          git push origin "HEAD:${{ github.head_ref }}"
