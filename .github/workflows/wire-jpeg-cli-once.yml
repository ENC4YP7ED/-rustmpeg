name: wire-jpeg-cli-once
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  wire:
    if: github.event.pull_request.number == 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup default 1.98.0
      - name: Wire JPEG registry and image pipeline
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('crates/rm-codec/src/lib.rs'); s=p.read_text()
          s=s.replace('    Png,\n}', '    Png,\n    Jpeg,\n}', 1)
          s=s.replace('const CODECS: [CodecDescriptor; 12] = [', 'const CODECS: [CodecDescriptor; 13] = [', 1)
          anchor='    CodecDescriptor {\n        id: CodecId::Png,\n        name: "png",\n        long_name: "PNG (Portable Network Graphics) image",\n        media_type: MediaType::Video,\n        can_decode: true,\n        can_encode: true,\n    },\n'
          if 'id: CodecId::Jpeg' not in s:
              s=s.replace(anchor, anchor+'    CodecDescriptor {\n        id: CodecId::Jpeg,\n        name: "mjpeg",\n        long_name: "MJPEG/JPEG image",\n        media_type: MediaType::Video,\n        can_decode: true,\n        can_encode: true,\n    },\n',1)
          s=s.replace('        CodecId::Png => &CODECS[11],\n', '        CodecId::Png => &CODECS[11],\n        CodecId::Jpeg => &CODECS[12],\n',1)
          s=s.replace('| CodecId::Png => None,', '| CodecId::Png\n        | CodecId::Jpeg => None,')
          s=s.replace('| CodecId::Png => {', '| CodecId::Png\n        | CodecId::Jpeg => {')
          p.write_text(s)

          p=Path('crates/rm-cli/src/image.rs'); s=p.read_text()
          if 'jpeg_decode' not in s:
              s=s.replace('use rm_codec::bmp::{decode_bmp, encode_bmp, probe_bmp};\n', 'use rm_codec::bmp::{decode_bmp, encode_bmp, probe_bmp};\nuse rm_codec::jpeg::{parse_jpeg, probe_jpeg};\nuse rm_codec::jpeg_decode::decode_jpeg;\nuse rm_codec::jpeg_encode::encode_jpeg;\n',1)
          s=s.replace('        .max(probe_png(bytes))', '        .max(probe_png(bytes))\n        .max(probe_jpeg(bytes))',1)
          s=s.replace('    let png_score = probe_png(bytes);\n    let best = pnm_score.max(bmp_score).max(tga_score).max(png_score);', '    let png_score = probe_png(bytes);\n    let jpeg_score = probe_jpeg(bytes);\n    let best = pnm_score.max(bmp_score).max(tga_score).max(png_score).max(jpeg_score);',1)
          s=s.replace('PBM/PGM/PPM/BMP/TGA/PNG)', 'PBM/PGM/PPM/BMP/TGA/PNG/JPEG)')
          jpeg_decode='''\n    if jpeg_score == best {\n        let _ = parse_jpeg(bytes)?;\n        return Ok(DecodedImage {\n            codec: CodecId::Jpeg,\n            frame: decode_jpeg(bytes)?,\n        });\n    }\n'''
          s=s.replace('    if png_score == best {', jpeg_decode+'    if png_score == best {',1)
          s=s.replace('        CodecId::Png => encode_png(frame),', '        CodecId::Png => encode_png(frame),\n        CodecId::Jpeg => encode_jpeg(frame),',1)
          s=s.replace('        CodecId::Targa | CodecId::Png => frame.format,', '        CodecId::Targa | CodecId::Png => frame.format,\n        CodecId::Jpeg => if frame.format == PixelFormat::Gray8 { PixelFormat::Gray8 } else { PixelFormat::Rgb24 },',1)
          s=s.replace('                | CodecId::Png\n', '                | CodecId::Png\n                | CodecId::Jpeg\n',1)
          s=s.replace('    } else if extension.eq_ignore_ascii_case("png") {\n        Some(CodecId::Png)\n', '    } else if extension.eq_ignore_ascii_case("png") {\n        Some(CodecId::Png)\n    } else if extension.eq_ignore_ascii_case("jpg") || extension.eq_ignore_ascii_case("jpeg") || extension.eq_ignore_ascii_case("jpe") {\n        Some(CodecId::Jpeg)\n',1)
          s=s.replace('        | CodecId::Png\n        | CodecId::PcmU8', '        | CodecId::Png\n        | CodecId::Jpeg\n        | CodecId::PcmU8',1)
          s=s.replace('CodecId::Ppm | CodecId::Bmp | CodecId::Targa | CodecId::Png => Ok(PixelFormat::Rgb24),', 'CodecId::Ppm | CodecId::Bmp | CodecId::Targa | CodecId::Png | CodecId::Jpeg => Ok(PixelFormat::Rgb24),',1)
          p.write_text(s)

          p=Path('crates/rm-cli/src/ffprobe.rs'); s=p.read_text()
          s=s.replace('        | CodecId::Png => "unknown",', '        | CodecId::Png\n        | CodecId::Jpeg => "unknown",',1)
          p.write_text(s)

          p=Path('crates/rm-format/tests/wave_matrix.rs'); s=p.read_text()
          s=s.replace('        | CodecId::Png => {', '        | CodecId::Png\n        | CodecId::Jpeg => {',1)
          p.write_text(s)
          PY
          cargo fmt --all
          cargo test --workspace --all-targets
          cargo build --workspace --release
      - name: Commit validated JPEG CLI wiring
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/rm-codec/src/lib.rs crates/rm-cli/src/image.rs crates/rm-cli/src/ffprobe.rs crates/rm-format/tests/wave_matrix.rs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(jpeg): expose baseline codec through image pipeline"
          git push origin "HEAD:${{ github.head_ref }}"
