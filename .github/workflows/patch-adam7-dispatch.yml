name: patch-adam7-dispatch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.number == 6
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Wire Adam7 dispatch
        shell: python
        run: |
          from pathlib import Path
          p = Path('crates/rm-codec/src/png.rs')
          text = p.read_text()
          old = '''#[path = "png_baseline.rs"]\nmod baseline;\n\npub use baseline::{encode_png, probe_png};'''
          new = '''#[path = "png_baseline.rs"]\nmod baseline;\n#[path = "png_adam7.rs"]\nmod adam7;\n\npub use baseline::{encode_png, probe_png};'''
          if old not in text:
              raise SystemExit('module anchor not found')
          text = text.replace(old, new, 1)
          old = '''pub fn decode_png(bytes: &[u8]) -> Result<VideoFrame> {\n    if is_16_bit_png(bytes) {\n        decode_png_16(bytes)\n    } else {\n        baseline::decode_png(bytes)\n    }\n}\n\nfn is_16_bit_png(bytes: &[u8]) -> bool {'''
          new = '''pub fn decode_png(bytes: &[u8]) -> Result<VideoFrame> {\n    if is_adam7_png(bytes) {\n        adam7::decode_png_adam7(bytes)\n    } else if is_16_bit_png(bytes) {\n        decode_png_16(bytes)\n    } else {\n        baseline::decode_png(bytes)\n    }\n}\n\nfn is_adam7_png(bytes: &[u8]) -> bool {\n    bytes.len() >= 29\n        && bytes.starts_with(&PNG_SIGNATURE)\n        && bytes.get(8..12) == Some(&13_u32.to_be_bytes())\n        && bytes.get(12..16) == Some(b"IHDR")\n        && bytes[28] == 1\n}\n\nfn is_16_bit_png(bytes: &[u8]) -> bool {'''
          if old not in text:
              raise SystemExit('dispatch anchor not found')
          p.write_text(text.replace(old, new, 1))
      - name: Format and test dispatch
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup default 1.98.0
          cargo fmt --all
          cargo test --workspace --all-targets
      - name: Commit tested dispatch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/rm-codec/src/png.rs crates/rm-codec/src/png_adam7.rs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(png): route Adam7 images through interlace decoder"
          git push origin "HEAD:${{ github.head_ref }}"
