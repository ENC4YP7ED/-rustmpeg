name: jpeg-oracle

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  jpeg-independent-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - name: Build rustmpeg ffmpeg
        run: cargo build -p rustmpeg-ffmpeg
      - name: Generate RGB source
        shell: python
        run: |
          from pathlib import Path
          rgb=bytearray()
          for y in range(16):
            for x in range(16):
              rgb += bytes((x*12, y*12, (x+y)*6))
          Path('/tmp/source.ppm').write_bytes(b'P6\n16 16\n255\n'+rgb)
      - name: Encode with rustmpeg
        run: target/debug/ffmpeg -hide_banner -y -i /tmp/source.ppm /tmp/rustmpeg.jpg
      - name: Decode rustmpeg JPEG with Go and compare source pixels
        run: |
          cat >/tmp/check.go <<'EOF'
          package main
          import("fmt";"image/jpeg";"os")
          func main(){
            f,e:=os.Open("/tmp/rustmpeg.jpg"); if e!=nil{panic(e)}; defer f.Close()
            img,e:=jpeg.Decode(f); if e!=nil{panic(e)}
            b:=img.Bounds(); if b.Dx()!=16||b.Dy()!=16{panic(fmt.Sprintf("size=%v",b))}
            max:=0
            for y:=0;y<16;y++{for x:=0;x<16;x++{
              r,g,bl,_:=img.At(x,y).RGBA(); got:=[3]int{int(r>>8),int(g>>8),int(bl>>8)}
              want:=[3]int{x*12,y*12,(x+y)*6}
              for c:=0;c<3;c++{d:=got[c]-want[c];if d<0{d=-d};if d>max{max=d}}
            }}
            if max>20{panic(fmt.Sprintf("encoder max channel error %d",max))}
          }
          EOF
          go run /tmp/check.go
      - name: Fetch immutable JPEG oracles
        run: |
          set -euo pipefail
          turbo=https://raw.githubusercontent.com/libjpeg-turbo/libjpeg-turbo/2646fa33f8d67373c27b558b47e77b2d8d517e31/testimages
          curl --fail --location --silent --show-error "$turbo/testorig.jpg" --output /tmp/baseline.jpg
          curl --fail --location --silent --show-error "$turbo/testimgint.jpg" --output /tmp/progressive.jpg
          corpus=https://raw.githubusercontent.com/imazen/codec-corpus/97836ec8ce8cdc59e95ef5467f24b7b6d370d896/jpeg-conformance/valid
          for name in restarts non-interleaved-mcu rst_1block rst_8block progressive_rst_420; do
            curl --fail --location --silent --show-error "$corpus/$name.jpg" --output "/tmp/$name.jpg"
          done
      - name: Build Go JPEG-to-PPM oracle
        run: |
          cat >/tmp/oracle.go <<'EOF'
          package main
          import("fmt";"image/jpeg";"os")
          func main(){
            if len(os.Args)!=3{panic("input output")}
            f,e:=os.Open(os.Args[1]);if e!=nil{panic(e)};defer f.Close()
            img,e:=jpeg.Decode(f);if e!=nil{panic(e)};b:=img.Bounds()
            o,e:=os.Create(os.Args[2]);if e!=nil{panic(e)};defer o.Close()
            fmt.Fprintf(o,"P6\n%d %d\n255\n",b.Dx(),b.Dy())
            for y:=b.Min.Y;y<b.Max.Y;y++{for x:=b.Min.X;x<b.Max.X;x++{r,g,bl,_:=img.At(x,y).RGBA();o.Write([]byte{byte(r>>8),byte(g>>8),byte(bl>>8)})}}
          }
          EOF
          cat >/tmp/compare.py <<'PY'
          import sys
          from pathlib import Path
          def pixels(path):
              d=Path(path).read_bytes(); p=d.split(b'\n',3); return p[1],p[2],p[3]
          rw,rh,r=pixels(sys.argv[1]); gw,gh,g=pixels(sys.argv[2])
          assert (rw,rh)==(gw,gh), ((rw,rh),(gw,gh))
          assert len(r)==len(g)
          m=max((abs(a-b) for a,b in zip(r,g)), default=0)
          limit=int(sys.argv[3])
          assert m<=limit, f'max channel delta={m}, limit={limit}'
          print(f'max channel delta={m}')
          PY
          cat >/tmp/compare_raw.py <<'PY'
          import sys
          from pathlib import Path
          d=Path(sys.argv[1]).read_bytes(); p=d.split(b'\n',3); r=p[3]
          g=Path(sys.argv[2]).read_bytes()
          assert len(r)==len(g), (len(r),len(g))
          m=max((abs(a-b) for a,b in zip(r,g)), default=0)
          limit=int(sys.argv[3])
          assert m<=limit, f'max channel delta={m}, limit={limit}'
          print(f'max channel delta={m}')
          PY
      - name: Compare baseline decoder against Go
        run: |
          target/debug/ffmpeg -hide_banner -y -i /tmp/baseline.jpg /tmp/rustmpeg-baseline.ppm
          go run /tmp/oracle.go /tmp/baseline.jpg /tmp/go-baseline.ppm
          python3 /tmp/compare.py /tmp/rustmpeg-baseline.ppm /tmp/go-baseline.ppm 4
      - name: Compare progressive decoder against Go
        run: |
          target/debug/ffmpeg -hide_banner -y -i /tmp/progressive.jpg /tmp/rustmpeg-progressive.ppm
          go run /tmp/oracle.go /tmp/progressive.jpg /tmp/go-progressive.ppm
          python3 /tmp/compare.py /tmp/rustmpeg-progressive.ppm /tmp/go-progressive.ppm 4
      - name: Validate restart, non-interleaved, and progressive-restart corpus against system FFmpeg
        run: |
          set -euo pipefail
          test -x /usr/bin/ffmpeg
          for name in restarts non-interleaved-mcu rst_1block rst_8block progressive_rst_420; do
            echo "testing $name"
            target/debug/ffmpeg -hide_banner -y -i "/tmp/$name.jpg" "/tmp/rustmpeg-$name.ppm"
            /usr/bin/ffmpeg -v error -y -i "/tmp/$name.jpg" -f rawvideo -pix_fmt rgb24 "/tmp/reference-$name.rgb"
            python3 /tmp/compare_raw.py "/tmp/rustmpeg-$name.ppm" "/tmp/reference-$name.rgb" 16
          done
