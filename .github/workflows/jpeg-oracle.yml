name: jpeg-oracle

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  jpeg-independent-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup default 1.98.0
      - name: Apply JPEG color-model implementation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('crates/rm-codec/src/jpeg_decode/full.rs')
          s=p.read_text()
          if 'enum ColorModel' in s:
              raise SystemExit(0)
          s=s.replace('struct Frame {', '''#[derive(Clone, Copy, Debug, Eq, PartialEq)]
          enum ColorModel {
              Gray,
              Ycbcr,
              Rgb,
              Cmyk,
              Ycck,
          }

          struct Frame {''', 1)
          s=s.replace('''    if width == 0 || height == 0 || !(count == 1 || count == 3) {
              return Err(MediaError::unsupported(
                  "JPEG frame must contain 1 or 3 components",
              ));
          }''','''    if width == 0 || height == 0 || !(count == 1 || count == 3 || count == 4) {
              return Err(MediaError::unsupported(
                  "JPEG frame must contain 1, 3, or 4 components",
              ));
          }''',1)
          start=s.index('fn render(')
          end=s.index('\npub fn decode_jpeg', start)
          render=r'''fn ycbcr_to_rgb(y: u8, cb: u8, cr: u8) -> [u8; 3] {
              let yy = f64::from(y);
              let cb = f64::from(cb) - 128.0;
              let cr = f64::from(cr) - 128.0;
              [
                  (yy + 1.402 * cr).round().clamp(0.0, 255.0) as u8,
                  (yy - 0.344_136 * cb - 0.714_136 * cr)
                      .round()
                      .clamp(0.0, 255.0) as u8,
                  (yy + 1.772 * cb).round().clamp(0.0, 255.0) as u8,
              ]
          }

          fn mul_div_255(a: u8, b: u8) -> u8 {
              ((u16::from(a) * u16::from(b) + 127) / 255) as u8
          }

          fn identify_color_model(frame: &Frame, adobe_transform: Option<u8>) -> Result<ColorModel> {
              match frame.components.len() {
                  1 => Ok(ColorModel::Gray),
                  3 => {
                      let ids: Vec<u8> = frame.components.iter().map(|component| component.id).collect();
                      if ids == [b'R', b'G', b'B'] || adobe_transform == Some(0) {
                          Ok(ColorModel::Rgb)
                      } else if adobe_transform == Some(2) {
                          Err(MediaError::invalid_data(
                              "Adobe YCCK transform requires four JPEG components",
                          ))
                      } else {
                          Ok(ColorModel::Ycbcr)
                      }
                  }
                  4 => match adobe_transform {
                      Some(2) => Ok(ColorModel::Ycck),
                      Some(1) => Err(MediaError::invalid_data(
                          "Adobe YCbCr transform cannot describe four JPEG components",
                      )),
                      Some(0) | None => Ok(ColorModel::Cmyk),
                      Some(_) => Err(MediaError::unsupported(
                          "unsupported Adobe JPEG color transform",
                      )),
                  },
                  _ => Err(MediaError::unsupported("unsupported JPEG component count")),
              }
          }

          fn render(
              frame: Frame,
              qtables: &[Option<[u16; 64]>; 4],
              adobe_transform: Option<u8>,
          ) -> Result<VideoFrame> {
              let color_model = identify_color_model(&frame, adobe_transform)?;
              let mut planes = Vec::with_capacity(frame.components.len());
              for component in &frame.components {
                  let qtable = qtables[usize::from(component.tq)]
                      .as_ref()
                      .ok_or_else(|| MediaError::invalid_data("missing JPEG quantization table"))?;
                  let width = component.padded_blocks_x * 8;
                  let height = component.padded_blocks_y * 8;
                  let mut plane = vec![0u8; width * height];
                  for by in 0..component.padded_blocks_y {
                      for bx in 0..component.padded_blocks_x {
                          let source = &component.coeffs[by * component.padded_blocks_x + bx];
                          let mut dequantized = [0i32; 64];
                          for k in 0..64 {
                              dequantized[k] = source[k]
                                  .checked_mul(i32::from(qtable[k]))
                                  .ok_or_else(|| MediaError::overflow("JPEG dequantization overflow"))?;
                          }
                          let block = idct(&dequantized);
                          for y in 0..8 {
                              let dst = (by * 8 + y) * width + bx * 8;
                              plane[dst..dst + 8].copy_from_slice(&block[y * 8..y * 8 + 8]);
                          }
                      }
                  }
                  planes.push((plane, width, height));
              }

              if color_model == ColorModel::Gray {
                  let (plane, stride, _) = &planes[0];
                  let mut output = vec![0u8; frame.width * frame.height];
                  for y in 0..frame.height {
                      output[y * frame.width..(y + 1) * frame.width]
                          .copy_from_slice(&plane[y * *stride..y * *stride + frame.width]);
                  }
                  return VideoFrame::from_vec(
                      u32::try_from(frame.width).unwrap(),
                      u32::try_from(frame.height).unwrap(),
                      PixelFormat::Gray8,
                      output,
                  );
              }

              let mut output = Vec::with_capacity(frame.width * frame.height * 3);
              for y in 0..frame.height {
                  for x in 0..frame.width {
                      let mut sample = [0u8; 4];
                      for ci in 0..frame.components.len() {
                          let component = &frame.components[ci];
                          let sx = x * usize::from(component.h) / usize::from(frame.max_h);
                          let sy = y * usize::from(component.v) / usize::from(frame.max_v);
                          sample[ci] = planes[ci].0[sy * planes[ci].1 + sx];
                      }
                      let rgb = match color_model {
                          ColorModel::Gray => unreachable!(),
                          ColorModel::Rgb => [sample[0], sample[1], sample[2]],
                          ColorModel::Ycbcr => ycbcr_to_rgb(sample[0], sample[1], sample[2]),
                          ColorModel::Cmyk => {
                              if adobe_transform == Some(0) {
                                  [
                                      mul_div_255(sample[0], sample[3]),
                                      mul_div_255(sample[1], sample[3]),
                                      mul_div_255(sample[2], sample[3]),
                                  ]
                              } else {
                                  [
                                      mul_div_255(255 - sample[0], 255 - sample[3]),
                                      mul_div_255(255 - sample[1], 255 - sample[3]),
                                      mul_div_255(255 - sample[2], 255 - sample[3]),
                                  ]
                              }
                          }
                          ColorModel::Ycck => {
                              let inverted_cmy = ycbcr_to_rgb(sample[0], sample[1], sample[2]);
                              [
                                  mul_div_255(inverted_cmy[0], sample[3]),
                                  mul_div_255(inverted_cmy[1], sample[3]),
                                  mul_div_255(inverted_cmy[2], sample[3]),
                              ]
                          }
                      };
                      output.extend_from_slice(&rgb);
                  }
              }
              VideoFrame::from_vec(
                  u32::try_from(frame.width).unwrap(),
                  u32::try_from(frame.height).unwrap(),
                  PixelFormat::Rgb24,
                  output,
              )
          }
          '''
          s=s[:start]+render+s[end:]
          s=s.replace('''    let mut restart_interval = 0u16;
              let mut saw_scan = false;''','''    let mut restart_interval = 0u16;
              let mut adobe_transform = None::<u8>;
              let mut saw_scan = false;''',1)
          s=s.replace('''        match marker {
                  0xdb => parse_dqt(payload, &mut qtables)?,''','''        match marker {
                  0xee => {
                      if payload.starts_with(b"Adobe") {
                          if payload.len() < 12 {
                              return Err(MediaError::invalid_data("truncated Adobe APP14 JPEG marker"));
                          }
                          let transform = payload[11];
                          if transform > 2 {
                              return Err(MediaError::unsupported(
                                  "unsupported Adobe JPEG color transform",
                              ));
                          }
                          if let Some(existing) = adobe_transform {
                              if existing != transform {
                                  return Err(MediaError::invalid_data(
                                      "conflicting Adobe APP14 JPEG transforms",
                                  ));
                              }
                          } else {
                              adobe_transform = Some(transform);
                          }
                      }
                  }
                  0xdb => parse_dqt(payload, &mut qtables)?,''',1)
          s=s.replace('    render(frame, &qtables)\n','    render(frame, &qtables, adobe_transform)\n',1)
          p.write_text(s)
          PY
          cargo fmt --all
      - name: Install independent FFmpeg oracle
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          command -v ffmpeg
      - name: Test full workspace after color-model patch
        run: cargo test --workspace --all-targets
      - name: Build rustmpeg ffmpeg
        run: cargo build -p rustmpeg-ffmpeg
      - name: Generate RGB source
        shell: python
        run: |
          from pathlib import Path
          rgb=bytearray()
          for y in range(16):
            for x in range(16):
              rgb += bytes((x*12, y*12, (x+y)*6))
          Path('/tmp/source.ppm').write_bytes(b'P6\n16 16\n255\n'+rgb)
      - name: Encode with rustmpeg
        run: target/debug/ffmpeg -hide_banner -y -i /tmp/source.ppm /tmp/rustmpeg.jpg
      - name: Decode rustmpeg JPEG with Go and compare source pixels
        run: |
          cat >/tmp/check.go <<'EOF'
          package main
          import("fmt";"image/jpeg";"os")
          func main(){
            f,e:=os.Open("/tmp/rustmpeg.jpg"); if e!=nil{panic(e)}; defer f.Close()
            img,e:=jpeg.Decode(f); if e!=nil{panic(e)}
            b:=img.Bounds(); if b.Dx()!=16||b.Dy()!=16{panic(fmt.Sprintf("size=%v",b))}
            max:=0
            for y:=0;y<16;y++{for x:=0;x<16;x++{
              r,g,bl,_:=img.At(x,y).RGBA(); got:=[3]int{int(r>>8),int(g>>8),int(bl>>8)}
              want:=[3]int{x*12,y*12,(x+y)*6}
              for c:=0;c<3;c++{d:=got[c]-want[c];if d<0{d=-d};if d>max{max=d}}
            }}
            if max>20{panic(fmt.Sprintf("encoder max channel error %d",max))}
          }
          EOF
          go run /tmp/check.go
      - name: Fetch immutable JPEG oracles
        run: |
          set -euo pipefail
          turbo=https://raw.githubusercontent.com/libjpeg-turbo/libjpeg-turbo/2646fa33f8d67373c27b558b47e77b2d8d517e31/testimages
          curl --fail --location --silent --show-error "$turbo/testorig.jpg" --output /tmp/baseline.jpg
          curl --fail --location --silent --show-error "$turbo/testimgint.jpg" --output /tmp/progressive.jpg
          corpus=https://raw.githubusercontent.com/imazen/codec-corpus/97836ec8ce8cdc59e95ef5467f24b7b6d370d896/jpeg-conformance/valid
          for name in restarts non-interleaved-mcu rst_1block rst_8block progressive_rst_420 rgb cmyk_logo cymk ycck; do
            curl --fail --location --silent --show-error "$corpus/$name.jpg" --output "/tmp/$name.jpg"
          done
      - name: Build comparison helpers
        run: |
          cat >/tmp/oracle.go <<'EOF'
          package main
          import("fmt";"image/jpeg";"os")
          func main(){
            if len(os.Args)!=3{panic("input output")}
            f,e:=os.Open(os.Args[1]);if e!=nil{panic(e)};defer f.Close()
            img,e:=jpeg.Decode(f);if e!=nil{panic(e)};b:=img.Bounds()
            o,e:=os.Create(os.Args[2]);if e!=nil{panic(e)};defer o.Close()
            fmt.Fprintf(o,"P6\n%d %d\n255\n",b.Dx(),b.Dy())
            for y:=b.Min.Y;y<b.Max.Y;y++{for x:=b.Min.X;x<b.Max.X;x++{r,g,bl,_:=img.At(x,y).RGBA();o.Write([]byte{byte(r>>8),byte(g>>8),byte(bl>>8)})}}
          }
          EOF
          cat >/tmp/compare.py <<'PY'
          import sys
          from pathlib import Path
          def pixels(path):
              d=Path(path).read_bytes(); p=d.split(b'\n',3); return p[1],p[2],p[3]
          rw,rh,r=pixels(sys.argv[1]); gw,gh,g=pixels(sys.argv[2])
          assert (rw,rh)==(gw,gh), ((rw,rh),(gw,gh))
          assert len(r)==len(g)
          m=max((abs(a-b) for a,b in zip(r,g)), default=0)
          limit=int(sys.argv[3])
          assert m<=limit, f'max channel delta={m}, limit={limit}'
          print(f'max channel delta={m}')
          PY
          cat >/tmp/compare_raw.py <<'PY'
          import sys
          from pathlib import Path
          d=Path(sys.argv[1]).read_bytes(); p=d.split(b'\n',3); r=p[3]
          g=Path(sys.argv[2]).read_bytes()
          assert len(r)==len(g), (len(r),len(g))
          m=max((abs(a-b) for a,b in zip(r,g)), default=0)
          limit=int(sys.argv[3])
          assert m<=limit, f'max channel delta={m}, limit={limit}'
          print(f'max channel delta={m}')
          PY
      - name: Compare baseline decoder against Go
        run: |
          target/debug/ffmpeg -hide_banner -y -i /tmp/baseline.jpg /tmp/rustmpeg-baseline.ppm
          go run /tmp/oracle.go /tmp/baseline.jpg /tmp/go-baseline.ppm
          python3 /tmp/compare.py /tmp/rustmpeg-baseline.ppm /tmp/go-baseline.ppm 4
      - name: Compare progressive decoder against Go
        run: |
          target/debug/ffmpeg -hide_banner -y -i /tmp/progressive.jpg /tmp/rustmpeg-progressive.ppm
          go run /tmp/oracle.go /tmp/progressive.jpg /tmp/go-progressive.ppm
          python3 /tmp/compare.py /tmp/rustmpeg-progressive.ppm /tmp/go-progressive.ppm 4
      - name: Validate restart and scan-layout corpus against system FFmpeg
        run: |
          set -euo pipefail
          reference_ffmpeg="$(command -v ffmpeg)"
          for name in restarts non-interleaved-mcu rst_1block rst_8block progressive_rst_420; do
            echo "testing $name"
            target/debug/ffmpeg -hide_banner -y -i "/tmp/$name.jpg" "/tmp/rustmpeg-$name.ppm"
            "$reference_ffmpeg" -v error -y -i "/tmp/$name.jpg" -f rawvideo -pix_fmt rgb24 "/tmp/reference-$name.rgb"
            python3 /tmp/compare_raw.py "/tmp/rustmpeg-$name.ppm" "/tmp/reference-$name.rgb" 16
          done
      - name: Validate RGB CMYK and YCCK color models against system FFmpeg
        run: |
          set -euo pipefail
          reference_ffmpeg="$(command -v ffmpeg)"
          for name in rgb cmyk_logo cymk ycck; do
            echo "testing color model $name"
            target/debug/ffmpeg -hide_banner -y -i "/tmp/$name.jpg" "/tmp/rustmpeg-$name.ppm"
            "$reference_ffmpeg" -v error -y -i "/tmp/$name.jpg" -f rawvideo -pix_fmt rgb24 "/tmp/reference-$name.rgb"
            python3 /tmp/compare_raw.py "/tmp/rustmpeg-$name.ppm" "/tmp/reference-$name.rgb" 16
          done
      - name: Commit validated JPEG color-model support
        run: |
          set -euo pipefail
          if git diff --quiet -- crates/rm-codec/src/jpeg_decode/full.rs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/rm-codec/src/jpeg_decode/full.rs
          git commit -m "feat(jpeg): decode RGB CMYK and YCCK color models"
          git push origin "HEAD:${{ github.head_ref }}"
