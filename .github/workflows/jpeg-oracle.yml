name: jpeg-oracle

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  jpeg-independent-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - name: Build rustmpeg ffmpeg
        run: cargo build -p rustmpeg-ffmpeg
      - name: Validate rustmpeg encoder with Go image/jpeg
        shell: python
        run: |
          from pathlib import Path
          rgb=bytearray()
          for y in range(16):
            for x in range(16):
              rgb += bytes((x*12, y*12, (x+y)*6))
          Path('/tmp/source.ppm').write_bytes(b'P6\n16 16\n255\n'+rgb)
      - run: target/debug/ffmpeg -hide_banner -y -i /tmp/source.ppm /tmp/rustmpeg.jpg
      - name: Decode rustmpeg JPEG with Go and compare source pixels
        run: |
          cat >/tmp/check.go <<'EOF'
          package main
          import("fmt";"image/jpeg";"os")
          func main(){
            f,e:=os.Open("/tmp/rustmpeg.jpg"); if e!=nil{panic(e)}; defer f.Close()
            img,e:=jpeg.Decode(f); if e!=nil{panic(e)}
            b:=img.Bounds(); if b.Dx()!=16||b.Dy()!=16{panic(fmt.Sprintf("size=%v",b))}
            max:=0
            for y:=0;y<16;y++{for x:=0;x<16;x++{
              r,g,bl,_:=img.At(x,y).RGBA(); got:=[3]int{int(r>>8),int(g>>8),int(bl>>8)}
              want:=[3]int{x*12,y*12,(x+y)*6}
              for c:=0;c<3;c++{d:=got[c]-want[c];if d<0{d=-d};if d>max{max=d}}
            }}
            if max>20{panic(fmt.Sprintf("encoder max channel error %d",max))}
          }
          EOF
          go run /tmp/check.go
      - name: Fetch immutable libjpeg-turbo baseline oracle
        run: |
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/libjpeg-turbo/libjpeg-turbo/2646fa33f8d67373c27b558b47e77b2d8d517e31/testimages/testorig.jpg \
            --output /tmp/upstream.jpg
      - name: Decode upstream JPEG with rustmpeg
        run: target/debug/ffmpeg -hide_banner -y -i /tmp/upstream.jpg /tmp/rustmpeg.ppm
      - name: Decode same upstream JPEG with Go and compare pixels
        run: |
          cat >/tmp/oracle.go <<'EOF'
          package main
          import("fmt";"image/jpeg";"os")
          func main(){
            f,e:=os.Open("/tmp/upstream.jpg");if e!=nil{panic(e)};defer f.Close()
            img,e:=jpeg.Decode(f);if e!=nil{panic(e)};b:=img.Bounds()
            o,e:=os.Create("/tmp/go.ppm");if e!=nil{panic(e)};defer o.Close()
            fmt.Fprintf(o,"P6\n%d %d\n255\n",b.Dx(),b.Dy())
            for y:=b.Min.Y;y<b.Max.Y;y++{for x:=b.Min.X;x<b.Max.X;x++{r,g,bl,_:=img.At(x,y).RGBA();o.Write([]byte{byte(r>>8),byte(g>>8),byte(bl>>8)})}}
          }
          EOF
          go run /tmp/oracle.go
          python3 - <<'PY'
          from pathlib import Path
          def p(path):
            d=Path(path).read_bytes(); parts=d.split(b'\n',3); return parts[1],parts[2],parts[3]
          rw,rh,r=p('/tmp/rustmpeg.ppm'); gw,gh,g=p('/tmp/go.ppm')
          assert (rw,rh)==(gw,gh), ((rw,rh),(gw,gh))
          assert len(r)==len(g)
          m=max(abs(a-b) for a,b in zip(r,g))
          assert m<=4, f'decoder max channel delta vs Go={m}'
          PY
