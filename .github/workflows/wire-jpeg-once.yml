name: wire-jpeg-once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  wire:
    if: github.event.pull_request.number == 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup default 1.98.0
      - name: Wire and validate JPEG parser
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('crates/rm-codec/src/lib.rs')
          s=p.read_text()
          needle='pub mod bmp;\n'
          if 'pub mod jpeg;' not in s:
              s=s.replace(needle, needle+'pub mod jpeg;\n', 1)
          p.write_text(s)
          PY
          cargo fmt --all
          cargo test -p rm-codec jpeg -- --nocapture
          cargo test --workspace --all-targets
      - name: Commit source wiring
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/rm-codec/src/lib.rs crates/rm-codec/src/jpeg.rs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(jpeg): compile bounded marker parser"
          git push origin "HEAD:${{ github.head_ref }}"
